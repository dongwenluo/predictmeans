url: https://dongwenluo.github.io/predictmeans/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#000080"
    border-radius: 0.5rem
    btn-border-radius: 0.5rem

home:
  sidebar:
    structure: [links, license, citation, authors, dev]
  title: "predictmeans: predicted means for linear, mixed and semiparametric models"
  description: >
    predictmeans gives predicted means, standard errors, contrasts, multiple
    comparisons, permutation and bootstrap tests, adjusted R-squared and
    diagnostics for aov, lm, glm, gls, lme, lmer, glmer, glmmTMB, gam and
    semiparametric models, with defaults chosen on the evidence, results
    checked against SAS and Genstat, and advice when a fit needs care.

navbar:
  structure:
    left: [intro, reference, articles, examples, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/predictmeans.html
    articles:
      text: Articles
      menu:
      - text: Getting started with predictmeans
        href: articles/predictmeans.html
      - text: Checking the model
        href: articles/checking.html
      - text: Link and response scale
        href: articles/response-scale.html
      - text: Contrasts, joint tests and slopes
        href: articles/contrasts.html
      - text: Missing cells and non-estimable means
        href: articles/missing-cells.html
      - text: Permutation and bootstrap tests
        href: articles/resampling.html
      - text: Smooth curves in mixed models
        href: articles/smooth.html
      - text: Adjusted R² for generalized linear mixed models
        href: articles/R2_glmm.html
      - text: -------
      - text: Checks against SAS and Genstat
      - text: Matching SAS PROC MIXED
        href: articles/sas.html
      - text: -------
      - text: Upgrading
      - text: Migrating from predictmeans 1.x
        href: articles/migrating.html
    examples:
      text: Worked examples
      menu:
      - text: Overview of predictmeans
        href: articles/overview.html
      - text: Experimental design and analysis for tree improvement
        href: articles/tree-improvement.html
      - text: "Adjusted R² for GLMMs: Piepho (2023) examples"
        href: articles/R2-GLMM.html
      - text: Ordinal and categorical responses
        href: articles/ordinal.html
      - text: Spatial analysis of a field trial
        href: articles/spatial.html
    news:
      text: News
      href: news/index.html

