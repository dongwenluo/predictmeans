# Reverse dependency check before a CRAN release (run by hand: Actions >
# revdep-check > Run workflow). Each CRAN package that uses predictmeans is
# checked with the CRAN version and with this version; the results are an
# artifact (revdep-results/summary.csv and the check logs).
on:
  workflow_dispatch:

name: revdep-check

permissions: read-all

jobs:
  revdep-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: false
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Check reverse dependencies
        run: Rscript --no-init-file dev/revdep-check.R

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revdep-results
          path: |
            revdep-results/summary.csv
            revdep-results/revdeps.txt
            revdep-results/*/*.Rcheck/00check.log
